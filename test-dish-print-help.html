<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>分菜打印帮助模态框测试</title>
    <style>
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      }
      .modal.hidden {
        display: none !important;
      }
      .modal-content {
        background: white;
        border-radius: 10px;
        max-width: 600px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
      }
      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
        border-bottom: 1px solid #e9ecef;
      }
      .close {
        font-size: 24px;
        font-weight: bold;
        color: #6c757d;
        cursor: pointer;
        padding: 5px;
      }
      .close:hover {
        color: #343a40;
      }
      .modal-body {
        padding: 20px;
      }
      .modal-footer {
        padding: 20px;
        border-top: 1px solid #e9ecef;
        text-align: right;
      }
      .btn-secondary {
        background: #6c757d;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
      }
      .test-button {
        background: #007bff;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 6px;
        cursor: pointer;
        margin: 10px;
      }
      .status {
        margin: 20px 0;
        padding: 15px;
        border-radius: 6px;
        font-weight: bold;
      }
      .status.success {
        background: #d4edda;
        color: #155724;
      }
      .status.error {
        background: #f8d7da;
        color: #721c24;
      }
      .status.info {
        background: #d1ecf1;
        color: #0c5460;
      }
    </style>
  </head>
  <body>
    <div
      style="
        max-width: 800px;
        margin: 20px auto;
        padding: 30px;
        background: white;
        border-radius: 10px;
      "
    >
      <h1>🍽️ 分菜打印帮助模态框测试</h1>

      <div class="status info">
        <strong>测试说明：</strong
        >此页面用于测试分菜打印帮助模态框的显示和关闭功能。
      </div>

      <div>
        <button class="test-button" onclick="showHelp()">显示帮助模态框</button>
        <button class="test-button" onclick="testCloseButton()">
          测试关闭按钮
        </button>
        <button class="test-button" onclick="testXButton()">测试X按钮</button>
      </div>

      <div id="testStatus"></div>
    </div>

    <!-- 分菜打印帮助模态框 -->
    <div id="dishPrintHelpModal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>🍽️ 分菜打印功能说明</h3>
          <span class="close">&times;</span>
        </div>
        <div class="modal-body">
          <div>
            <h4>功能概述</h4>
            <p>
              分菜打印功能允许根据菜品的
              <code>printer_type</code> 字段将订单分配到不同的打印机。
            </p>
            <h4>使用方法</h4>
            <ol>
              <li><strong>启用分菜模式</strong>：勾选"启用分菜打印模式"</li>
              <li>
                <strong>设置打印机编号</strong>：为每台打印机设置编号（1-99）
              </li>
              <li>
                <strong>开始打印</strong>：新订单会根据 printer_type
                自动分配到对应打印机
              </li>
            </ol>
          </div>
        </div>
        <div class="modal-footer">
          <button id="closeDishPrintHelpBtn" class="btn-secondary">关闭</button>
        </div>
      </div>
    </div>

    <script>
      function showHelp() {
        const modal = document.getElementById('dishPrintHelpModal');
        modal.classList.remove('hidden');
        updateStatus('✅ 帮助模态框已显示', 'success');
      }

      function hideHelp() {
        const modal = document.getElementById('dishPrintHelpModal');
        modal.classList.add('hidden');
        updateStatus('✅ 帮助模态框已隐藏', 'success');
      }

      function updateStatus(message, type) {
        const statusDiv = document.getElementById('testStatus');
        statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        console.log(`[TEST] ${message}`);
      }

      function testCloseButton() {
        showHelp();
        setTimeout(() => {
          const closeBtn = document.getElementById('closeDishPrintHelpBtn');
          if (closeBtn) {
            closeBtn.click();
            updateStatus('✅ 关闭按钮测试完成', 'success');
          } else {
            updateStatus('❌ 未找到关闭按钮', 'error');
          }
        }, 500);
      }

      function testXButton() {
        showHelp();
        setTimeout(() => {
          const xBtn = document.querySelector('#dishPrintHelpModal .close');
          if (xBtn) {
            xBtn.click();
            updateStatus('✅ X按钮测试完成', 'success');
          } else {
            updateStatus('❌ 未找到X按钮', 'error');
          }
        }, 500);
      }

      document.addEventListener('DOMContentLoaded', function () {
        // 关闭按钮事件
        document
          .getElementById('closeDishPrintHelpBtn')
          .addEventListener('click', function () {
            console.log('[TEST] 关闭按钮被点击');
            hideHelp();
          });

        // X按钮事件
        document
          .querySelector('#dishPrintHelpModal .close')
          .addEventListener('click', function () {
            console.log('[TEST] X按钮被点击');
            hideHelp();
          });

        // 背景点击事件
        document
          .getElementById('dishPrintHelpModal')
          .addEventListener('click', function (e) {
            if (e.target.id === 'dishPrintHelpModal') {
              console.log('[TEST] 背景被点击');
              hideHelp();
            }
          });

        updateStatus('✅ 事件绑定完成，可以开始测试', 'info');
      });
    </script>
  </body>
</html>
